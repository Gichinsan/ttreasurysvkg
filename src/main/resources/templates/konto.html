<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Konto Übersicht</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{header :: header}"></div>
<main>
<h1>Willkommen, <span th:text="${user.username}">Benutzer</span></h1>

<p>Ihre Kontonummer: <strong th:text="${user.kontoCode}">123456</strong></p>

<form th:action="@{/konto}" th:object="${user}" method="post">
    <label for="kontoBeschreibung">Konto Beschreibung:</label>
    <textarea id="kontoBeschreibung" th:field="*{kontoBeschreibung}"></textarea>
    <br>
    <div th:if="${#fields.hasErrors('kontoBeschreibung')}">
        <p style="color: red;" th:errors="*{kontoBeschreibung}">Fehler in der Beschreibung</p>
    </div>
    <button type="submit">Beschreibung speichern</button>
</form>

<div th:if="${success}">
    <p style="color: green;">Beschreibung erfolgreich aktualisiert!</p>
</div>

<div th:if="${error}">
    <p style="color: red;">Fehler beim Speichern der Beschreibung!</p>
</div>
</main>
</body>
</html>
