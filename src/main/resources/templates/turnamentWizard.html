<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title>Turnier-Planung</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<!-- Header einbinden -->
<div th:replace="~{header :: header}"></div>

<main>
    <h1>Turnier-Planung</h1>

    <div class="ui container centered">
        <div class="ui small steps">
            <div class="active step">
                <i class="users icon"></i>
                <div class="content">
                    <div class="title">Step 1</div>
                    <div class="description">Allgemeine Turnierdaten</div>
                </div>
            </div>
            <div class="disabled step">
                <i class="tasks icon"></i>
                <div class="content">
                    <div class="title">Step 2</div>
                    <div class="description">Team und Trainer Zuordnung</div>
                </div>
            </div>
            <div class="disabled step">
                <i class="futbol icon"></i>
                <div class="content">
                    <div class="title">Step 3</div>
                    <div class="description">Review Kader</div>
                </div>
            </div>
            <div class="disabled step">
                <i class="info icon"></i>
                <div class="content">
                    <div class="title">Step 4</div>
                    <div class="description">Freigabe & Hinweise</div>
                </div>
            </div>
        </div>


        <h2>Step 1</h2>
        <form th:action="@{/tw2}" method="post"
              th:object="${turnament}">
            <div class="ui two column grid">
                <div class="row">
                    <div class="column">
                        <div class="ui form">
                            <div class="field">
                                <label for="club">Verein:</label>
                                <input type="text" id="club" name="verein" th:field="*{club}" class="fluid" placeholder="Verein eingeben"/>
                            </div>
                        </div>
                    </div>
                    <div class="column">
                        <div class="ui form">
                            <div class="field">
                                <label for="turanmentDate">Datum:</label>
                                <input type="date" id="turanmentDate" name="turanmentDate" th:field="*{turanmentDate}" class="fluid" required/>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="column">
                        <div class="ui form">
                            <div class="field">
                                <label for="place">Ort:</label>
                                <input type="text" id="place" name="place" th:field="*{place}" class="fluid" placeholder="Ort eingeben"/>
                            </div>
                        </div>
                    </div>
                    <div class="column">
                        <div class="ui form">
                            <div class="field">
                                <label for="ageGroup">Altersgruppe:</label>
                                <select class="ui dropdown" th:field="*{ageGroup}" id="ageGroup">
                                    <option value="" disabled selected>Altersgruppe auswählen</option>
                                    <option value="G1">G1</option>
                                    <option value="G2">G2</option>
                                    <option value="F2">F2</option>
                                    <option value="F1">F1</option>
                                    <option value="E">E</option>
                                    <option value="pending">Pending</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="ui center aligned grid">
                <div class="row">
                    <button class="green submit button" type="submit">
                        <i class="green caret square right icon"></i>Weiter zu Step 2
                    </button>
                </div>
            </div>
        </form>


        <div th:if="${message}">
            <div class="ui positive message">
                <p th:text="${message}"></p>
            </div>
        </div>

    </div>


</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.js"></script>
</body>
</html>
