<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title>Teammitglieder-Liste</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<!-- Header einbinden -->
<div th:replace="~{header :: header}"></div>

<main>
    <h1>Teammitglieder</h1>

    <div class="ui three column grid">
        <div class="row">
            <div class="column">
                <h3><a href="#" th:href="@{/team/create}"><i class="green plus square icon"></i>Neues Teammitglied
                    erfassen</a></h3>
            </div>
            <div class="column">
                <h3><a href="#" th:href="@{/team/statistik}"><i class="green plus square icon"></i>Team Statistik</a></h3>
            </div>
            <div class="column">
                <h3><a href="#" th:href="@{/team/upload}"><i class="green plus square icon"></i>Mitgliederliste
                    Hochladen</a></h3>
            </div>
        </div>
    </div>


    <table id="teamTable" class="ui inverted green table">
        <thead>
        <tr>
            <th class="sortable" data-sort-key="firstName" style="cursor: pointer;">Firstname</th>
            <th class="sortable" data-sort-key="lastName" style="cursor: pointer;">Lastname</th>
            <th class="sortable" data-sort-key="birthDate" style="cursor: pointer;">Birthdate</th>
            <th class="sortable" data-sort-key="ageGroup" style="cursor: pointer;">Altersgruppe</th>
            <th>Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="teammember : ${team}">
            <td th:text="${teammember.firstName}"></td>
            <td th:text="${teammember.lastName}"></td>
            <td th:text="${#dates.format(teammember.birthDate,'dd.MM.yyyy')}"></td>
            <td th:text="${teammember.ageGroup}"></td>
            <td>
                <a th:href="@{/team/update/{id}(id=${teammember.id})}" class="ui button">Bearbeiten</a>
                <form th:action="@{/team/remove}" method="post" style="display:inline;">
                    <input type="hidden" name="id" th:value="${teammember.id}"/>
                    <button type="submit" class="ui red button">Löschen</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>


</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const table = document.getElementById('teamTable');
        if (!table) {
            return;
        }

        const headers = table.querySelectorAll('thead th.sortable');
        const tbody = table.querySelector('tbody');
        const sortDirection = {};

        headers.forEach(function (header) {
            header.addEventListener('click', function () {
                const key = header.getAttribute('data-sort-key');
                const isAscending = sortDirection[key] !== 'asc';
                sortDirection[key] = isAscending ? 'asc' : 'desc';

                const rows = Array.from(tbody.querySelectorAll('tr'));
                rows.sort(function (a, b) {
                    const aValue = a.cells[header.cellIndex].textContent.trim().toLowerCase();
                    const bValue = b.cells[header.cellIndex].textContent.trim().toLowerCase();

                    const isDateColumn = key === 'birthDate';
                    if (isDateColumn) {
                        const aDate = new Date(aValue.split('.').reverse().join('-'));
                        const bDate = new Date(bValue.split('.').reverse().join('-'));
                        return isAscending ? aDate - bDate : bDate - aDate;
                    }

                    if (aValue < bValue) {
                        return isAscending ? -1 : 1;
                    }
                    if (aValue > bValue) {
                        return isAscending ? 1 : -1;
                    }
                    return 0;
                });

                rows.forEach(function (row) {
                    tbody.appendChild(row);
                });
            });
        });
    });
</script>
</body>
</html>
