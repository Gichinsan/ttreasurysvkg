<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Neue Transaktion hinzufügen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{header :: header}"></div>
<main>
<h1>Neue Transaktion hinzufügen</h1>

<form th:action="@{/transactions/add}" th:object="${transaction}" method="post">
    <label for="type">Typ:</label>
    <select id="type" th:field="*{type}">
        <option value="Einnahme">Einnahme</option>
        <option value="Ausgabe">Ausgabe</option>
    </select>
    <br>

    <label for="amount">Betrag:</label>
    <input type="number" id="amount" th:field="*{amount}" step="0.01" required />
    <br>

    <label for="description">Beschreibung:</label>
    <textarea id="description" th:field="*{description}"></textarea>
    <br>

    <!-- Stelle sicher, dass date korrekt verarbeitet wird -->
    <input type="hidden" th:field="*{date}" th:value="${transaction.date}" />

    <button type="submit">Speichern</button>
</form>

<a href="#" th:href="@{/transactions}">Zurück zu den Transaktionen</a>

</main>
</body>
</html>
