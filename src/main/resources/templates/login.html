<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<header>
    <div class="logo">
        <img th:src="@{/img/logo.png}" alt="Logo"/>
    </div>
</header>
<main>
    <div th:if="${param.logout}">
        <p style="color: green;">Sie haben sich erfolgreich abgemeldet.</p>
    </div>
    <div class="ui placeholder segment">
        <div class="ui two column very relaxed stackable grid">
            <!-- Login Form auf der linken Seite -->
            <div class="column">
                <form th:action="@{/login}" method="post">
                    <div class="ui form">
                        <div class="field">
                            <label>Username</label>
                            <div class="ui left icon input">
                                <input type="text" placeholder="Username" id="username" name="username"/>
                                <i class="user icon"></i>
                            </div>
                        </div>
                        <div class="field">
                            <label>Password</label>
                            <div class="ui left icon input">
                                <input type="password" id="password" name="password"/>
                                <i class="lock icon"></i>
                            </div>
                        </div>
                        <button type="submit" class="ui big green submit button">Login</button>
                    </div>
                </form>
            </div>

            <!-- Register Form auf der rechten Seite -->
            <div class="column">
                <div class="ui form">
                    <form th:action="@{/register}" method="post">
                        <div>
                            <button type="submit" class="ui big green submit button"><i class="signup icon"></i>Register
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Vertikaler Divider -->
        <div class="ui vertical divider">
            Or
        </div>
    </div>
</main>
</body>
</html>
