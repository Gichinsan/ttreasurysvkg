<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title>Trikotsatz erfassen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<!-- Header einbinden -->
<div th:replace="~{header :: header}"></div>

<main>
    <h1>Trikotsatz erfassen</h1>
    <form class="ui form"
          th:action="${trikotSatz.id != null} ? @{/trikots/update/{id}(id=${trikotSatz.id})} : @{/trikots/erstellen}"
          method="post"
          enctype="multipart/form-data"
          th:object="${trikotSatz}">
        <div class="four wide field">
            <label for="trikotTyp">Trikot-Typ</label>
            <select class="ui dropdown" th:field="*{trikotTyp}" id="trikotTyp">
                <option value="HEIM">Heim</option>
                <option value="AUSWAERTS">Auswärts</option>
            </select>
        </div>

        <div class="four wide field">
            <label for="trikotAnzahl">Trikot Anzahl</label>
            <input type="number" th:field="*{trikotAnzahl}" id="trikotAnzahl" required>
        </div>

        <div class="four wide field">
            <label for="hoseAnzahl">Hose Anzahl</label>
            <input type="number" th:field="*{hoseAnzahl}" id="hoseAnzahl" required>
        </div>

        <div class="four wide field">
            <label for="hoseGroesse">Hose Größe</label>
            <input type="text" th:field="*{hoseGroesse}" id="hoseGroesse" required>
        </div>

        <div class="four wide field">
            <label for="stutzenAnzahl">Stutzen Anzahl</label>
            <input type="number" th:field="*{stutzenAnzahl}" id="stutzenAnzahl" required>
        </div>

        <button type="submit"><i class="green save icon"></i>Speichern</button>
    </form>

    <h3><a href="#" th:href="@{/kit}"><i class="green step backward icon"></i>Zurück zu den Transaktionen</a></h3>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.js"></script>
</body>
</html>
