<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Turnier-Planung</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<!-- Header einbinden -->
<div th:replace="~{header :: header}"></div>

<main>
    <h1>Turnier-Planung</h1>

    <div class="ui container centered">
        <div class="ui small steps">
            <div class="disabled step">
                <i class="users icon"></i>
                <div class="content">
                    <div class="title">Step 1</div>
                    <div class="description">Allgemeine Turnierdaten</div>
                </div>
            </div>
            <div class="active step">
                <i class="tasks icon"></i>
                <div class="content">
                    <div class="title">Step 2</div>
                    <div class="description">Team und Trainer Zuordnung</div>
                </div>
            </div>
            <div class="disabled step">
                <i class="futbol icon"></i>
                <div class="content">
                    <div class="title">Step 3</div>
                    <div class="description">Review Kader</div>
                </div>
            </div>
            <div class="disabled step">
                <i class="info icon"></i>
                <div class="content">
                    <div class="title">Step 4</div>
                    <div class="description">Freigabe & Hinweise</div>
                </div>
            </div>
        </div>


        <h2>Step 2</h2>
        <form th:action="@{/reviewKader}" method="post"
              th:object="${turnament}">
            <div class="ui two column grid">
                <div class="row">
                    <div class="column">
                        <h3 class="ui header">Spieler</h3>
                        <div class="ui form">
                            <table class="ui inverted green table">
                                <thead>
                                <tr>
                                    <th>Firstname</th>
                                    <th>Lastname</th>
                                    <th>Kader</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="teammember : ${teamMembers}">
                                    <td th:text="${teammember.firstName}"></td>
                                    <td th:text="${teammember.lastName}"></td>
                                    <td>
                                        <input type="checkbox" name="selectedPlayers" th:value="${teammember.id}">
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="column">
                        <h3 class="ui header">Trainer</h3>
                        <div class="ui form">
                            <table class="ui inverted green table">
                                <thead>
                                <tr>
                                    <th>Firstname</th>
                                    <th>Lastname</th>
                                    <th>Kader</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="coach : ${coaches}">
                                    <td th:text="${coach.firstName}"></td>
                                    <td th:text="${coach.lastName}"></td>
                                    <td>
                                        <input type="checkbox" name="selectedCoaches" th:value="${coach.id}">
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="ui center aligned grid">
                    <div class="row">
                        <button class="green submit button" type="submit">
                            <i class="green caret square right icon"></i>Weiter zu Step 3
                        </button>
                    </div>
                </div>
            </div>
        </form>


        <div th:if="${message}">
            <div class="ui positive message">
                <p th:text="${message}"></p>
            </div>
        </div>

    </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.js"></script>
</body>
</html>
